
<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
</head>
<body style="font-family:Arial;text-align:center;">

<h2>Admin Panel</h2>

<input id="bep20" placeholder="BEP20 Rate"><br><br>
<input id="trc20" placeholder="TRC20 Rate"><br><br>
<input id="star" placeholder="Star Rate"><br><br>

<button onclick="updateRate()">Update</button>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function updateRate(){
  db.ref("rates").set({
    bep20: document.getElementById("bep20").value,
    trc20: document.getElementById("trc20").value,
    star: document.getElementById("star").value
  });
  alert("Rate Updated!");
}
</script>

</body>
</html>
